
name: DAST - OWASP ZAP

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dast:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout backend
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository == 'Phongsakorn123/ai-sales-support-hub-backend' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || 'Phongsakorn123/ai-sales-support-hub-backend' }}
          ref: ${{ github.repository == 'Phongsakorn123/ai-sales-support-hub-backend' && github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.repository == 'Phongsakorn123/ai-sales-support-hub-backend' && github.event_name != 'pull_request' && github.ref_name || 'main' }}
          path: ai-sales-support-hub-backend

      - name: Checkout frontend
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository == 'Phongsakorn123/ai-sales-support-hub-frontend' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || 'Phongsakorn123/ai-sales-support-hub-frontend' }}
          ref: ${{ github.repository == 'Phongsakorn123/ai-sales-support-hub-frontend' && github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.repository == 'Phongsakorn123/ai-sales-support-hub-frontend' && github.event_name != 'pull_request' && github.ref_name || 'main' }}
          path: ai-sales-support-hub-frontend

      - name: Create CI test environment
        working-directory: ai-sales-support-hub-backend
        run: |
          if [ -e .env ]; then
            echo "Refusing to overwrite existing .env"
            exit 1
          fi
          printf '%s\n' \
            'APP_NAME=AI Sales Support Hub API' \
            'APP_VERSION=1.0.0' \
            'ENVIRONMENT=test' \
            'API_PREFIX=/api/v1' \
            'DATABASE_PATH=/app/data/app.db' \
            'JWT_SECRET_KEY=ci-only-test-secret-key-not-for-production-0123456789' \
            'OPENROUTER_API_KEY=' \
            'OPENROUTER_MODEL=' \
            'OPENROUTER_BASE_URL=https://openrouter.ai/api/v1' \
            'OPENROUTER_TIMEOUT_SECONDS=5' > .env

      - name: Build and start application
        working-directory: ai-sales-support-hub-backend
        run: |
          mkdir -p data storage/documents
          APP_UID="$(id -u)" APP_GID="$(id -g)" docker compose up --build -d

      - name: Wait for application readiness
        id: readiness
        run: |
          for i in $(seq 1 36); do
            if curl -fsS http://localhost:3001/ -o /dev/null &&
               curl -fsS http://localhost:8002/health -o /dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose -f ai-sales-support-hub-backend/compose.yaml logs --no-color || true
          exit 1

      - name: ZAP Baseline - Frontend
        if: always() && steps.readiness.outcome == 'success'
        uses: zaproxy/action-baseline@7c4deb10e6261301961c86d65d54a516394f9aed # v0.14.0
        with:
          target: http://localhost:3001
          cmd_options: '-I -J zap-frontend.json -w zap-frontend.md -r zap-frontend.html'

      - name: ZAP Baseline - Backend API docs
        if: always() && steps.readiness.outcome == 'success'
        uses: zaproxy/action-baseline@7c4deb10e6261301961c86d65d54a516394f9aed # v0.14.0
        with:
          target: http://localhost:8002/docs
          cmd_options: '-I -J zap-backend.json -w zap-backend.md -r zap-backend.html'

      - name: Upload DAST reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dast-reports-${{ github.run_id }}
          path: |
            zap-frontend.json
            zap-frontend.md
            zap-frontend.html
            zap-backend.json
            zap-backend.md
            zap-backend.html
          if-no-files-found: warn
          retention-days: 30

      - name: Stop test application
        if: always()
        working-directory: ai-sales-support-hub-backend
        run: docker compose down --remove-orphans
