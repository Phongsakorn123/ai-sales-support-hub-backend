services:
  backend:
    # These defaults match the current macOS workspace; override for other host UIDs.
    user: "${APP_UID:-501}:${APP_GID:-20}"
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/app.db
      DOCUMENT_STORAGE_DIR: /app/storage/documents
      HF_HOME: /app/data/huggingface
      HF_HUB_DISABLE_XET: "1"
      ENVIRONMENT: development
    ports:
      - "8002:8000"
    volumes:
      - ./data:/app/data
      - ./storage/documents:/app/storage/documents
    restart: unless-stopped

  frontend:
    build:
      context: ../ai-sales-support-hub-frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://backend:8000/api/v1
      NEXT_PUBLIC_AI_AGENT_API_URL: http://backend:8000/api/v1
    ports:
      - "3001:3000"
    depends_on:
      - backend
    restart: unless-stopped
